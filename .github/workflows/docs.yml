name: Docs

on:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy documentation
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          LD_PRELOAD: ""
          NODE_OPTIONS: ""

      - name: Reject checkout symlinks
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          LD_PRELOAD: ""
          NODE_OPTIONS: ""
        run: |
          set -euo pipefail
          links="$(find . -path ./.git -prune -o -type l -print)"
          if [ -n "${links}" ]; then
            echo "Checkout contains symlinks; refusing to build:" >&2
            echo "${links}" >&2
            exit 1
          fi

      - name: Reject unexpected packages
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          LD_PRELOAD: ""
          NODE_OPTIONS: ""
          GITHUB_TOKEN: ""
        run: |
          set -euo pipefail
          while IFS='=' read -r name _; do
            case "${name}" in
              GITHUB_TOKEN|ACTIONS_*) unset "${name}" ;;
            esac
          done < <(env)
          bash .github/scripts/reject-unexpected-packages.sh

      - name: Setup Python
        uses: actions/setup-python@v7
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          LD_PRELOAD: ""
          NODE_OPTIONS: ""
        with:
          python-version: "3.12"

      - name: Install documentation dependencies
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          LD_PRELOAD: ""
          NODE_OPTIONS: ""
          GITHUB_TOKEN: ""
        run: |
          set -euo pipefail
          while IFS='=' read -r name _; do
            case "${name}" in
              GITHUB_TOKEN|ACTIONS_*) unset "${name}" ;;
            esac
          done < <(env)
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      - name: Configure git
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          LD_PRELOAD: ""
          NODE_OPTIONS: ""
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Resolve release version
        id: version
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          LD_PRELOAD: ""
          NODE_OPTIONS: ""
          REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "${REF_TYPE}" != "tag" ]; then
            echo "Documentation deploy requires a tag." >&2
            exit 1
          fi

          VERSION="${GITHUB_REF_NAME}"

          if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: ${VERSION}" >&2
            exit 1
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Build versioned documentation
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          LD_PRELOAD: ""
          NODE_OPTIONS: ""
          GITHUB_TOKEN: ""
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          while IFS='=' read -r name _; do
            case "${name}" in
              GITHUB_TOKEN|ACTIONS_*) unset "${name}" ;;
            esac
          done < <(env)
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git update-ref refs/heads/gh-pages refs/remotes/origin/gh-pages
          fi
          mike deploy --ignore-remote-status --update-aliases \
            --alias-type=redirect \
            "${RELEASE_VERSION}" latest
          mike set-default --ignore-remote-status latest
          # Capture gh-pages before the token exists. The bundle does not
          # include hooks or config planted by the documentation build.
          git -c core.hooksPath=/dev/null bundle create \
            "${RUNNER_TEMP}/gh-pages.bundle" refs/heads/gh-pages

      - name: Push documentation
        working-directory: ${{ runner.temp }}
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          LD_PRELOAD: ""
          NODE_OPTIONS: ""
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PATH: /usr/sbin:/usr/bin:/sbin:/bin
        run: |
          set -euo pipefail
          # Push from a repository that never executed project code. Build-step
          # hooks, hooksPath, and git config must not be able to read the token.
          unset GIT_DIR GIT_WORK_TREE GIT_COMMON_DIR GIT_NAMESPACE \
            GIT_CONFIG_PARAMETERS GIT_EXEC_PATH || true
          while IFS='=' read -r name _; do
            case "${name}" in
              GIT_CONFIG_KEY_*|GIT_CONFIG_VALUE_*) unset "${name}" ;;
            esac
          done < <(env)
          export GIT_CONFIG_COUNT=0
          export GIT_CONFIG_NOSYSTEM=1
          work="$(mktemp -d)"
          empty="${work}/gitconfig"
          : > "${empty}"
          export GIT_CONFIG_GLOBAL="${empty}"
          export GIT_CONFIG_SYSTEM="${empty}"
          git clone --bare "${RUNNER_TEMP}/gh-pages.bundle" "${work}/repo.git"
          cd "${work}/repo.git"
          rm -rf hooks
          mkdir hooks
          git config --local core.hooksPath "${PWD}/hooks"
          trap 'git config --local --unset-all http.https://github.com/.extraheader || true' EXIT
          basic="$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 | tr -d '\n')"
          git config --local http.https://github.com/.extraheader \
            "AUTHORIZATION: basic ${basic}"
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git push --no-verify origin "refs/heads/gh-pages:refs/heads/gh-pages"
