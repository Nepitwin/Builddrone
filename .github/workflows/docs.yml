name: Docs

on:
  workflow_call:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy documentation
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      # mike version history must not live on gh-pages. A push to that branch
      # starts GitHub's built-in "pages build and deployment" workflow.
      DOCS_BRANCH: docs-versions
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reject checkout symlinks
        run: |
          set -euo pipefail
          links="$(find . -path ./.git -prune -o -type l -print)"
          if [ -n "${links}" ]; then
            echo "Checkout contains symlinks; refusing to build:" >&2
            echo "${links}" >&2
            exit 1
          fi

      - name: Reject unexpected packages
        env:
          GITHUB_TOKEN: ""
        run: |
          set -euo pipefail
          while IFS='=' read -r name _; do
            case "${name}" in
              GITHUB_TOKEN|ACTIONS_*) unset "${name}" ;;
            esac
          done < <(env)
          bash .github/scripts/reject-unexpected-packages.sh

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install documentation dependencies
        env:
          GITHUB_TOKEN: ""
        run: |
          set -euo pipefail
          while IFS='=' read -r name _; do
            case "${name}" in
              GITHUB_TOKEN|ACTIONS_*) unset "${name}" ;;
            esac
          done < <(env)
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Resolve release version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "${REF_TYPE}" != "tag" ]; then
            echo "Documentation deploy requires a tag." >&2
            exit 1
          fi

          VERSION="${GITHUB_REF_NAME}"

          if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: ${VERSION}" >&2
            exit 1
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Build versioned documentation
        env:
          GITHUB_TOKEN: ""
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          while IFS='=' read -r name _; do
            case "${name}" in
              GITHUB_TOKEN|ACTIONS_*) unset "${name}" ;;
            esac
          done < <(env)
          if [ -z "${DOCS_BRANCH}" ]; then
            echo "DOCS_BRANCH is required." >&2
            exit 1
          fi
          if git show-ref --verify --quiet "refs/remotes/origin/${DOCS_BRANCH}"; then
            git update-ref "refs/heads/${DOCS_BRANCH}" "refs/remotes/origin/${DOCS_BRANCH}"
          elif git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git update-ref "refs/heads/${DOCS_BRANCH}" refs/remotes/origin/gh-pages
          fi
          mike deploy --ignore-remote-status --update-aliases \
            --alias-type=redirect \
            --branch "${DOCS_BRANCH}" \
            "${RELEASE_VERSION}" latest
          mike set-default --ignore-remote-status --branch "${DOCS_BRANCH}" latest

      - name: Push documentation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          trap 'git config --local --unset-all http.https://github.com/.extraheader || true' EXIT
          basic="$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 | tr -d '\n')"
          git config --local http.https://github.com/.extraheader \
            "AUTHORIZATION: basic ${basic}"
          if [ -z "${DOCS_BRANCH}" ]; then
            echo "DOCS_BRANCH is required." >&2
            exit 1
          fi
          git push origin "refs/heads/${DOCS_BRANCH}:refs/heads/${DOCS_BRANCH}"

      - name: Export published site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          if [ -z "${DOCS_BRANCH}" ]; then
            echo "DOCS_BRANCH is required." >&2
            exit 1
          fi
          git archive "refs/heads/${DOCS_BRANCH}" | tar -x -C _site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: "true"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
