name: Verify

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "*"
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:

  black:
    name: Black formatting check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Reject checkout symlinks
        run: |
          set -euo pipefail
          links="$(find . -path ./.git -prune -o -type l -print)"
          if [ -n "${links}" ]; then
            echo "Checkout contains symlinks; refusing to lint:" >&2
            echo "${links}" >&2
            exit 1
          fi

      - name: Reject unexpected packages
        env:
          GITHUB_TOKEN: ""
        run: |
          set -euo pipefail
          while IFS='=' read -r name _; do
            case "${name}" in
              GITHUB_TOKEN|ACTIONS_*) unset "${name}" ;;
            esac
          done < <(env)
          bash .github/scripts/reject-unexpected-packages.sh

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        env:
          GITHUB_TOKEN: ""
        run: |
          set -euo pipefail
          while IFS='=' read -r name _; do
            case "${name}" in
              GITHUB_TOKEN|ACTIONS_*) unset "${name}" ;;
            esac
          done < <(env)
          python -m pip install --upgrade pip
          pip install black

      - name: Run Black check
        env:
          GITHUB_TOKEN: ""
        run: |
          set -euo pipefail
          while IFS='=' read -r name _; do
            case "${name}" in
              GITHUB_TOKEN|ACTIONS_*) unset "${name}" ;;
            esac
          done < <(env)
          black --check src tests


  isort:
    name: Import sorting check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Reject checkout symlinks
        run: |
          set -euo pipefail
          links="$(find . -path ./.git -prune -o -type l -print)"
          if [ -n "${links}" ]; then
            echo "Checkout contains symlinks; refusing to lint:" >&2
            echo "${links}" >&2
            exit 1
          fi

      - name: Reject unexpected packages
        env:
          GITHUB_TOKEN: ""
        run: |
          set -euo pipefail
          while IFS='=' read -r name _; do
            case "${name}" in
              GITHUB_TOKEN|ACTIONS_*) unset "${name}" ;;
            esac
          done < <(env)
          bash .github/scripts/reject-unexpected-packages.sh

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        env:
          GITHUB_TOKEN: ""
        run: |
          set -euo pipefail
          while IFS='=' read -r name _; do
            case "${name}" in
              GITHUB_TOKEN|ACTIONS_*) unset "${name}" ;;
            esac
          done < <(env)
          python -m pip install --upgrade pip
          pip install isort

      - name: Run isort check
        env:
          GITHUB_TOKEN: ""
        run: |
          set -euo pipefail
          while IFS='=' read -r name _; do
            case "${name}" in
              GITHUB_TOKEN|ACTIONS_*) unset "${name}" ;;
            esac
          done < <(env)
          isort --check-only src tests


  pylint:
    name: Pylint static analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Reject checkout symlinks
        run: |
          set -euo pipefail
          links="$(find . -path ./.git -prune -o -type l -print)"
          if [ -n "${links}" ]; then
            echo "Checkout contains symlinks; refusing to lint:" >&2
            echo "${links}" >&2
            exit 1
          fi

      - name: Reject unexpected packages
        env:
          GITHUB_TOKEN: ""
        run: |
          set -euo pipefail
          while IFS='=' read -r name _; do
            case "${name}" in
              GITHUB_TOKEN|ACTIONS_*) unset "${name}" ;;
            esac
          done < <(env)
          bash .github/scripts/reject-unexpected-packages.sh

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        env:
          GITHUB_TOKEN: ""
        run: |
          set -euo pipefail
          while IFS='=' read -r name _; do
            case "${name}" in
              GITHUB_TOKEN|ACTIONS_*) unset "${name}" ;;
            esac
          done < <(env)
          python -m pip install --upgrade pip
          pip install .
          pip install pylint

      - name: Run pylint
        env:
          GITHUB_TOKEN: ""
        run: |
          set -euo pipefail
          while IFS='=' read -r name _; do
            case "${name}" in
              GITHUB_TOKEN|ACTIONS_*) unset "${name}" ;;
            esac
          done < <(env)
          pylint src tests


  pytest:
    name: Run tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version:
          - "3.8"
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Reject checkout symlinks
        run: |
          set -euo pipefail
          links="$(find . -path ./.git -prune -o -type l -print)"
          if [ -n "${links}" ]; then
            echo "Checkout contains symlinks; refusing to test:" >&2
            echo "${links}" >&2
            exit 1
          fi

      - name: Reject unexpected packages
        env:
          GITHUB_TOKEN: ""
        run: |
          set -euo pipefail
          while IFS='=' read -r name _; do
            case "${name}" in
              GITHUB_TOKEN|ACTIONS_*) unset "${name}" ;;
            esac
          done < <(env)
          bash .github/scripts/reject-unexpected-packages.sh

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        env:
          GITHUB_TOKEN: ""
        run: |
          set -euo pipefail
          while IFS='=' read -r name _; do
            case "${name}" in
              GITHUB_TOKEN|ACTIONS_*) unset "${name}" ;;
            esac
          done < <(env)
          python -m pip install --upgrade pip
          pip install .
          pip install pytest

      - name: Run tests
        env:
          GITHUB_TOKEN: ""
        run: |
          set -euo pipefail
          while IFS='=' read -r name _; do
            case "${name}" in
              GITHUB_TOKEN|ACTIONS_*) unset "${name}" ;;
            esac
          done < <(env)
          pytest


  build:
    name: Build package
    runs-on: ubuntu-latest

    needs:
      - black
      - isort
      - pylint
      - pytest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reject checkout symlinks
        run: |
          set -euo pipefail
          links="$(find . -path ./.git -prune -o -type l -print)"
          if [ -n "${links}" ]; then
            echo "Checkout contains symlinks; refusing to build:" >&2
            echo "${links}" >&2
            exit 1
          fi

      - name: Reject unexpected packages
        env:
          GITHUB_TOKEN: ""
        run: |
          set -euo pipefail
          while IFS='=' read -r name _; do
            case "${name}" in
              GITHUB_TOKEN|ACTIONS_*) unset "${name}" ;;
            esac
          done < <(env)
          bash .github/scripts/reject-unexpected-packages.sh

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build dependencies
        env:
          GITHUB_TOKEN: ""
        run: |
          set -euo pipefail
          while IFS='=' read -r name _; do
            case "${name}" in
              GITHUB_TOKEN|ACTIONS_*) unset "${name}" ;;
            esac
          done < <(env)
          python -m pip install --upgrade pip
          pip install build

      - name: Build distribution
        env:
          GITHUB_TOKEN: ""
        run: |
          set -euo pipefail
          while IFS='=' read -r name _; do
            case "${name}" in
              GITHUB_TOKEN|ACTIONS_*) unset "${name}" ;;
            esac
          done < <(env)
          rm -rf dist
          mkdir dist
          python -m build

      - name: Upload distribution artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error


  publish:
    name: Publish package to PyPI
    runs-on: ubuntu-latest

    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download distribution artifact
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
