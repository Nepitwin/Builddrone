[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "builddrone"
dynamic = ["version"]
description = "Modular build framework"
authors = [{ name = "Andreas Sekulski" }]
readme = "README.md"
requires-python = ">=3.8"

[project.urls]
Homepage = "https://github.com/Nepitwin/Builddrone"
Documentation = "https://nepitwin.github.io/Builddrone/latest/"
Repository = "https://github.com/Nepitwin/Builddrone"
PyPI = "https://pypi.org/project/builddrone/"


[project.optional-dependencies]
dev = [
    "build",
    "twine",
    "pytest",
    "black",
    "isort",
    "pylint"
]
docs = [
    "mkdocs-material",
    "mike"
]


[tool.setuptools.packages.find]
where = ["src"]


[tool.setuptools_scm]
fallback_version = "0.0.0"


[tool.isort]
profile = "black"
line_length = 88


[tool.pytest.ini_options]
pythonpath = [
    "src"
]


[tool.pylint.main]
init-hook = "import sys; sys.path.insert(0, 'src')"
